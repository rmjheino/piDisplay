<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PIDisplay Dashboard</title>
  <style>
{{ DASHBOARD_CSS }}
  </style>
</head>
<body>
  <div class="shell">
    <div class="grid">
      <section class="panel header-panel">
        <div class="time-box">
          <div class="time-main">
            <div id="clock" class="clock">--:--:--</div>
            <div id="date" class="date">--</div>
          </div>
          <div class="next-leave-wrap">
            <div class="next-leave-row">
              <img class="next-leave-logo" src="{{ HSL_LOGO_SRC }}" alt="HSL logo">
              <div class="next-departure-wrap">
                <strong id="next-departure" class="transit-time">--</strong>
                <span id="next-departure-alert" class="alert-indicator" hidden aria-label="Route alert" title="Alert on route HSL:1004"></span>
              </div>
            </div>
            <div class="tag">Leave from home</div>
          </div>
        </div>
      </section>
      <section class="panel sensor-panel">
        <div class="sensor-table-wrap">
          <table class="sensor-table">
            <thead>
              <tr>
                <th scope="col">Sensor name</th>
                <th scope="col">Temperature</th>
                <th scope="col">Humidity</th>
                <th scope="col">Pressure</th>
              </tr>
            </thead>
            <tbody id="sensor-table-body">
              <tr class="sensor-row sensor-row-placeholder">
                <th scope="row">Loading sensors...</th>
                <td>--</td>
                <td>--</td>
                <td>--</td>
              </tr>
            </tbody>
          </table>
        </div>
      </section>
    </div>
  </div>
  <script>
    const FORCE_TRANSIT_ALERT_INDICATOR = false;

    const elements = {
      clock: document.getElementById('clock'),
      date: document.getElementById('date'),
      nextDeparture: document.getElementById('next-departure'),
      nextDepartureAlert: document.getElementById('next-departure-alert'),
      sensorTableBody: document.getElementById('sensor-table-body')
    };

    function updateClock() {
      const now = new Date();
      elements.clock.textContent = now.toLocaleTimeString('en-GB');
      elements.date.textContent = now.toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
    }

    function renderSensorRows(sensors) {
      if (!elements.sensorTableBody) {
        return;
      }
      const rows = (sensors || []).slice(0, 3).map((sensor) => {
        const name = sensor.name || '--';
        const temperature = sensor.temperature || '--';
        const humidity = sensor.humidity || '--';
        const pressure = sensor.pressure || '--';
        return `
          <tr class="sensor-row">
            <th scope="row">${name}</th>
            <td>${temperature}</td>
            <td>${humidity}</td>
            <td>${pressure}</td>
          </tr>
        `;
      }).join('');
      elements.sensorTableBody.innerHTML = rows || `
        <tr class="sensor-row sensor-row-placeholder">
          <th scope="row">No sensors</th>
          <td>--</td>
          <td>--</td>
          <td>--</td>
        </tr>
      `;
    }

    function updateDashboard(data) {
      renderSensorRows(data.sensors || []);
    }

    async function refreshData() {
      try {
        const response = await fetch('/api/data');
        const data = await response.json();
        updateDashboard(data);
      } catch (error) {
        console.error(error);
      }
    }

    updateClock();
    refreshData();
    setInterval(updateClock, 1000);
    setInterval(refreshData, 3000);

    function leaveHomeAt(departureTime, offsetMinutes = 4) {
      const match = /^(\d{1,2}):(\d{2})$/.exec(String(departureTime || ''));
      if (!match) {
        return '--';
      }
      const hours = Number(match[1]);
      const minutes = Number(match[2]);
      if (Number.isNaN(hours) || Number.isNaN(minutes) || hours < 0 || hours > 23 || minutes < 0 || minutes > 59) {
        return '--';
      }
      const minutesPerDay = 24 * 60;
      const totalMinutes = (((hours * 60) + minutes - offsetMinutes) % minutesPerDay + minutesPerDay) % minutesPerDay;
      const leaveHours = Math.floor(totalMinutes / 60);
      const leaveMinutes = totalMinutes % 60;
      return `${String(leaveHours).padStart(2, '0')}:${String(leaveMinutes).padStart(2, '0')}`;
    }

    async function fetchTransit() {
      try {
        const resp = await fetch('/api/transit');
        const data = await resp.json();
        if (data.status) {
          elements.nextDeparture.textContent = '--';
          elements.nextDepartureAlert.hidden = true;
          return;
        }

        const departures = Array.isArray(data.departures) ? data.departures : [];
        const hasAlerts = Boolean(data.has_alerts) || FORCE_TRANSIT_ALERT_INDICATOR;
        const leaveTimes = departures.map((a) => {
          const departureTime = a.is_realtime ? a.realtime : a.scheduled;
          return leaveHomeAt(departureTime, 4);
        }).filter((time) => time !== '--');
        const nextLeaveTime = leaveTimes[0] || '--';

        elements.nextDeparture.textContent = nextLeaveTime;
        elements.nextDepartureAlert.hidden = !hasAlerts || nextLeaveTime === '--';
      } catch (e) {
        elements.nextDeparture.textContent = '--';
        elements.nextDepartureAlert.hidden = true;
        console.error(e);
      }
    }

    fetchTransit();
    setInterval(fetchTransit, 300000);
  </script>
</body>
</html>
