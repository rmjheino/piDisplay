<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PIDisplay Dashboard</title>
  <style>
{{ DASHBOARD_CSS }}
  </style>
</head>
<body>
  <div class="shell">
    <div class="grid">
      <section class="panel clock-panel">
        <div id="clock" class="clock">--:--:--</div>
        <div class="date-box">
          <div id="date" class="date">--</div>
        </div>
      </section>
      <section class="panel transit-panel">
        <div class="next-leave-row">
          <div class="tram-times" id="tram-times"></div>
          <div class="transit-divider"></div>
          <img class="next-leave-logo" src="{{ HSL_LOGO_SRC }}" alt="HSL logo">
          <div class="next-departure-wrap">
            <strong id="next-departure" class="transit-time">--</strong>
            <span id="next-departure-alert" class="alert-indicator" hidden aria-label="Route alert" title="Alert on route HSL:1004"></span>
          </div>
        </div>
      </section>
      <section class="panel sensor-panel">
        <div class="sensor-cards" id="sensor-cards">
          <div class="sensor-card sensor-card-placeholder">
            <div class="sensor-temp">99</div>
            <div class="sensor-sub">
              <span>99</span>
              <span>99</span>
            </div>
          </div>
        </div>
      </section>
    </div>
  <script>
    const FORCE_TRANSIT_ALERT_INDICATOR = false;

    const SENSOR_ICONS = {
      'Makuuhuone': `
        <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M10 20v50" stroke="currentColor" stroke-width="6" stroke-linecap="round"/>
          <path d="M10 44h14a6 6 0 0 1 6 6v6h48a10 10 0 0 1 10 10v4" stroke="currentColor" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
          <rect x="16" y="36" width="16" height="14" rx="4" stroke="currentColor" stroke-width="6"/>
          <path d="M10 70v8M88 70v8" stroke="currentColor" stroke-width="6" stroke-linecap="round"/>
        </svg>
      `,
      'Keittiö': `
        <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M50 30c-16 0-28 13-28 32 0 16 11 30 22 30 4 0 6-2 10-2s6 2 10 2c11 0 22-14 22-30 0-19-12-32-28-32-2 0-4 1-8 3-4-2-6-3-8-3z" stroke="currentColor" stroke-width="6" stroke-linejoin="round"/>
          <path d="M50 30c0-8 4-14 12-18" stroke="currentColor" stroke-width="6" stroke-linecap="round"/>
          <path d="M50 22c6-8 16-10 22-8" stroke="currentColor" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      `,
      'Terassi': `
        <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="50" cy="50" r="20" stroke="currentColor" stroke-width="6"/>
          <path d="M50 12v-4M50 88v4M12 50h-4M88 50h4M23 23l-3-3M77 23l3-3M23 77l-3 3M77 77l3 3" stroke="currentColor" stroke-width="6" stroke-linecap="round"/>
        </svg>
      `
    };
    const DEFAULT_SENSOR_ICON = `
      <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="50" cy="50" r="34" stroke="currentColor" stroke-width="6"/>
      </svg>
    `;

    const elements = {
      clock: document.getElementById('clock'),
      date: document.getElementById('date'),
      nextDeparture: document.getElementById('next-departure'),
      nextDepartureAlert: document.getElementById('next-departure-alert'),
      tramTimes: document.getElementById('tram-times'),
      sensorCards: document.getElementById('sensor-cards')
    };

    function updateClock() {
      const now = new Date();
      const day = String(now.getDate()).padStart(2, '0');
      const month = String(now.getMonth() + 1).padStart(2, '0');
      const year = now.getFullYear();
      elements.clock.textContent = now.toLocaleTimeString('en-GB');
      elements.date.textContent = `${day}.${month}.${year}`;
    }

    function renderSensorCards(sensors) {
      if (!elements.sensorCards) {
        return;
      }
      const cards = (sensors || []).slice(0, 3).map((sensor) => {
        const name = sensor.name || '--';
        const temperature = sensor.temperature || '99';
        const humidity = sensor.humidity || '99';
        const pressure = sensor.pressure || '99';
        const icon = SENSOR_ICONS[name] || DEFAULT_SENSOR_ICON;
        return `
          <div class="sensor-card" title="${name}" aria-label="${name}">
            <div class="sensor-icon">${icon}</div>
            <div class="sensor-temp">${temperature}°</div>
            <div class="sensor-sub">
              <span>${humidity}%</span>
              <span>${pressure} hPa</span>
            </div>
          </div>
        `;
      }).join('');
      elements.sensorCards.innerHTML = cards || `
        <div class="sensor-card sensor-card-placeholder">
          <div class="sensor-temp">99</div>
          <div class="sensor-sub">
            <span>99</span>
            <span>99</span>
          </div>
        </div>
      `;
    }

    function updateDashboard(data) {
      renderSensorCards(data.sensors || []);
    }

    async function refreshData() {
      try {
        const response = await fetch('/api/data');
        const data = await response.json();
        updateDashboard(data);
      } catch (error) {
        console.error(error);
      }
    }

    updateClock();
    refreshData();
    setInterval(updateClock, 1000);
    setInterval(refreshData, 3000);


    function leaveHomeAt(departureTime, offsetMinutes = 4) {
      const match = /^(\d{1,2}):(\d{2})$/.exec(String(departureTime || ''));
      if (!match) {
        return '--';
      }
      const hours = Number(match[1]);
      const minutes = Number(match[2]);
      if (Number.isNaN(hours) || Number.isNaN(minutes) || hours < 0 || hours > 23 || minutes < 0 || minutes > 59) {
        return '--';
      }
      const minutesPerDay = 24 * 60;
      const totalMinutes = (((hours * 60) + minutes - offsetMinutes) % minutesPerDay + minutesPerDay) % minutesPerDay;
      const leaveHours = Math.floor(totalMinutes / 60);
      const leaveMinutes = totalMinutes % 60;
      return `${String(leaveHours).padStart(2, '0')}:${String(leaveMinutes).padStart(2, '0')}`;
    }

    function renderTramTimes(departures) {
      if (!elements.tramTimes) {
        return;
      }
      const times = departures.slice(0, 2).map((a) => a.is_realtime ? a.realtime : a.scheduled);
      elements.tramTimes.innerHTML = times.map((time) => `<span>${time}</span>`).join('');
    }

    async function fetchTransit() {
      try {
        const resp = await fetch('/api/transit');
        const data = await resp.json();
        if (data.status) {
          elements.nextDeparture.textContent = '--';
          elements.nextDepartureAlert.hidden = true;
          renderTramTimes([]);
          return;
        }

        const departures = Array.isArray(data.departures) ? data.departures : [];
        const hasAlerts = Boolean(data.has_alerts) || FORCE_TRANSIT_ALERT_INDICATOR;
        const leaveTimes = departures.map((a) => {
          const departureTime = a.is_realtime ? a.realtime : a.scheduled;
          return leaveHomeAt(departureTime, 4);
        }).filter((time) => time !== '--');
        const nextLeaveTime = leaveTimes[0] || '--';

        elements.nextDeparture.textContent = nextLeaveTime;
        elements.nextDepartureAlert.hidden = !hasAlerts || nextLeaveTime === '--';
        renderTramTimes(departures);
      } catch (e) {
        elements.nextDeparture.textContent = '--';
        elements.nextDepartureAlert.hidden = true;
        renderTramTimes([]);
        console.error(e);
      }
    }

    fetchTransit();
    setInterval(fetchTransit, 300000);
  </script>
</body>
</html>
